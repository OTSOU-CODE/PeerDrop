<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PeerDrop — Sharing Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="mesh-bg" aria-hidden="true"></div>
<canvas id="particles" aria-hidden="true"></canvas>

<!-- ══ HOME VIEW ══════════════════════════════════════════════════════ -->
<main id="home-view" class="view">
  <header class="site-header" style="justify-content: center; padding-top: 60px;">
    <div class="logo">
      <span class="logo-icon">⬡</span>
      <span class="logo-text" style="font-size: 2.5rem;">PeerDrop</span>
    </div>
  </header>
  
  <p style="text-align: center; color: rgba(255,255,255,0.5); margin-bottom: 20px;">
    Direct P2P Sharing Rooms. No servers. No limits.
  </p>

  <div class="glass-card" style="display: flex; flex-direction: column; gap: 24px;">
    
    <!-- Create Room -->
    <div style="text-align: center; padding-bottom: 24px; border-bottom: 1px solid rgba(255,255,255,0.08);">
      <p class="card-label" style="margin-bottom: 12px;">START A NEW ROOM</p>
      <button id="btn-create-room" class="btn-primary" style="width: 100%; padding: 16px; font-size: 1.1rem;">
        + Create Room
      </button>
    </div>

    <!-- Join Room -->
    <div style="text-align: center;">
      <p class="card-label" style="margin-bottom: 12px;">JOIN EXISTING ROOM</p>
      <div class="code-entry-row">
        <input id="input-join-code" class="glass-input mono code-input-big" type="text" maxlength="6" placeholder="ROOM ID"/>
        <button id="btn-join-room" class="btn-primary">Join</button>
      </div>
      <p id="join-error" class="connect-err" hidden>Room not found.</p>
    </div>

  </div>
</main>

<!-- ══ ROOM VIEW ══════════════════════════════════════════════════════ -->
<main id="room-view" class="view" hidden style="max-width: 800px; height: 100vh; padding: 20px; display: flex; flex-direction: column; gap: 15px;">
  
  <header class="glass-card" style="padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-radius: 16px;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <span class="logo-icon">⬡</span>
      <div>
        <h1 style="font-size: 1.1rem; font-weight: 700;">Room: <span id="room-code-display" class="mono" style="color: #0d9488;">---</span></h1>
        <p style="font-size: 0.75rem; color: rgba(255,255,255,0.4);" id="peer-count-display">1 participant</p>
      </div>
    </div>
    <div style="display: flex; gap: 10px;">
      <button id="btn-copy-link" class="btn-ghost-sm" style="padding: 8px 14px;">Copy Link</button>
      <button id="btn-leave-room" class="btn-ghost-sm" style="padding: 8px 14px; color: #f87171; border-color: rgba(248,113,113,0.3);">Leave</button>
    </div>
  </header>

  <!-- File Feed -->
  <div id="file-feed" class="glass-card" style="flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; border-radius: 16px;">
    
    <div style="text-align: center; color: rgba(255,255,255,0.3); font-size: 0.85rem; margin-top: auto; margin-bottom: auto;" id="empty-feed-msg">
      <span style="font-size: 2rem; display: block; margin-bottom: 10px;">👋</span>
      Welcome to the room.<br/>Drop a file below to share it with everyone.
    </div>

  </div>

  <!-- Drop Zone / Upload -->
  <div class="glass-card" id="room-drop-zone" style="padding: 20px; border-radius: 16px; cursor: pointer; border: 1.5px dashed rgba(255,255,255,0.15); text-align: center; transition: all 0.2s;">
    <p style="font-weight: 600; font-size: 1rem;">Drop files here</p>
    <p style="font-size: 0.8rem; color: rgba(255,255,255,0.4);">or click to browse</p>
    <input id="room-file-input" type="file" hidden multiple />
  </div>

</main>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="app.js"></script>
</body>
</html>
