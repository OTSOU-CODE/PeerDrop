<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PeerDrop — Sharing Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet"/>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div id="toast-container"></div>
<div class="mesh-bg" aria-hidden="true"></div>
<canvas id="particles" aria-hidden="true"></canvas>

<!-- ══ HOME VIEW ══════════════════════════════════════════════════════ -->
<main id="home-view" class="view">
  <header class="site-header animate-enter-1" style="justify-content: center; padding-top: 60px;">
    <div class="logo">
      <span class="logo-icon">⬡</span>
      <span class="logo-text" style="font-size: 2.5rem;">PeerDrop</span>
    </div>
  </header>
  
  <p class="animate-enter-2" style="text-align: center; color: var(--text-dim); margin-bottom: 20px;">
    Direct P2P Sharing Rooms. No servers. No limits.
  </p>

  <div class="glass-card animate-enter-3" style="display: flex; flex-direction: column; gap: 24px;">
    
    <!-- Display Name -->
    <div style="text-align: center; padding-bottom: 24px; border-bottom: 1px solid rgba(255,255,255,0.05);">
      <p class="card-label" style="margin-bottom: 12px;">YOUR DISPLAY NAME</p>
      <input id="input-display-name" class="glass-input" type="text" placeholder="What should we call you?" style="width: 100%; text-align: center; font-size: 1.1rem; font-weight: 600; padding: 16px;"/>
    </div>

    <!-- Create Room -->
    <div style="text-align: center; padding-bottom: 24px; border-bottom: 1px solid rgba(255,255,255,0.05);">
      <p class="card-label" style="margin-bottom: 12px;">START A NEW ROOM</p>
      <button id="btn-create-room" class="btn-primary" style="width: 100%; padding: 16px; font-size: 1.1rem;">
        + Create Room
      </button>
    </div>

    <!-- Join Room -->
    <div style="text-align: center;">
      <p class="card-label" style="margin-bottom: 12px;">JOIN EXISTING ROOM</p>
      <div class="code-entry-row">
        <input id="input-join-code" class="glass-input mono code-input-big" type="text" maxlength="6" placeholder="ROOM ID"/>
        <button id="btn-join-room" class="btn-primary">Join</button>
      </div>
      <p id="join-error" class="connect-err" hidden>Room not found.</p>
    </div>

  </div>
</main>

<!-- ══ ROOM VIEW ══════════════════════════════════════════════════════ -->
<main id="room-view" class="view room-layout" hidden>
  
  <!-- Sidebar -->
  <aside class="glass-card sidebar-card">
    <h3 class="card-label" style="border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 12px; margin-bottom: 12px;">ROOM MEMBERS</h3>
    <div id="user-list" style="display: flex; flex-direction: column; gap: 10px; overflow-y: auto; padding-right: 5px;">
      <!-- Populated dynamically -->
    </div>
  </aside>

  <!-- Main Content Area -->
  <div class="main-chat-area">
    
    <header class="glass-card" style="padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-radius: 16px;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <span class="logo-icon">⬡</span>
        <div>
          <h1 style="font-size: 1.1rem; font-weight: 700;">Room: <span id="room-code-display" class="mono" style="color: var(--accent);">---</span></h1>
          <p style="font-size: 0.75rem; color: var(--text-dim);" id="peer-count-display"><span class="status-pulse connecting"></span>Connecting...</p>
        </div>
      </div>
      <div style="display: flex; gap: 10px;">
        <button id="btn-copy-link" class="btn-ghost-sm" style="padding: 8px 14px;">Copy Link</button>
        <button id="btn-leave-room" class="btn-ghost-sm" style="padding: 8px 14px; color: #f87171; border-color: rgba(248,113,113,0.3);">Leave</button>
      </div>
    </header>

    <!-- File Feed -->
    <div class="glass-card" style="flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; border-radius: 16px;">
      <h2 class="card-label" style="display:flex; justify-content:space-between; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 12px;">
        <span>📋 Room Feed</span>
        <span id="notif-btn" style="cursor:pointer; font-size: 1.2rem;" title="Enable Desktop Notifications">🔕</span>
      </h2>
      <div id="file-feed" style="flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:10px; min-height: 250px; padding-right: 5px;">
        
        <div style="text-align: center; color: var(--text-dim); font-size: 0.9rem; margin-top: auto; margin-bottom: auto;" id="empty-feed-msg">
          <span style="font-size: 2.5rem; display: block; margin-bottom: 15px; opacity: 0.8;">✨</span>
          Welcome to the room.<br/>Drop a file or paste an image below.
        </div>

      </div>
    </div>

  <!-- Chat / File Input Area -->
  <div style="font-size:0.75rem; color:var(--text-dim); margin-left:12px; height: 16px;" id="typing-indicator"></div>
  <div class="glass-card" style="padding: 12px; border-radius: 16px; display: flex; gap: 10px; align-items: center;">
    <button id="btn-attach" class="btn-ghost-sm" style="font-size: 1.4rem; padding: 6px 14px; border: none; cursor: pointer;" title="Send File" aria-label="Attach File">📎</button>
    <button id="btn-share-screen" class="btn-ghost-sm" style="font-size: 1.4rem; padding: 6px 14px; border: none; cursor: pointer;" title="Share Screen">🖥️</button>
    <input id="room-file-input" type="file" hidden multiple />
    <input id="chat-input" type="text" class="glass-input" placeholder="Type a message, drop a file, or paste (CTRL+V)..." style="flex: 1; font-size: 0.95rem; padding: 12px 16px; border: none; background: rgba(255,255,255,0.02);" autocomplete="off" />
    <button id="btn-send-chat" class="btn-primary" style="padding: 10px 24px;">Send</button>
  </div>
  
  </div> <!-- End Main Content -->
</main>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script src="app.js"></script>
</body>
</html>
